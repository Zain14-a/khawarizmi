<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الخوارزمي</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.getItem('khawarizmi_theme');if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans Arabic','Segoe UI',Tahoma,sans-serif}
html[data-theme="dark"]{color-scheme:dark}
:root{
  --bg:#0d0d0d;--fg:#f5f0e8;--muted:#9a9185;--accent:#D4A843;--accent2:#e07a5f;
  --card:rgba(22,20,18,.82);--border:rgba(212,168,67,.18);
  --glow:rgba(212,168,67,.25);--teal:#1a535c;--warm:#3d2e1f;
}
html[data-theme="light"]{
  --bg:#f5f0e8;--fg:#1a1612;--muted:#7a7064;--accent:#b8892e;--accent2:#c4684a;
  --card:rgba(255,253,248,.92);--border:rgba(184,137,46,.2);
  --glow:rgba(184,137,46,.2);--teal:#1a535c;--warm:#d4c4a8;
}
body{min-height:100vh;background:var(--bg);color:var(--fg);display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 600px 400px at 25% 20%,rgba(212,168,67,.09),transparent),radial-gradient(ellipse 500px 500px at 75% 80%,rgba(26,83,92,.10),transparent),radial-gradient(ellipse 300px 300px at 50% 50%,rgba(224,122,95,.06),transparent);pointer-events:none}
body::after{content:"";position:absolute;width:120px;height:120px;background:radial-gradient(circle,rgba(212,168,67,.07),transparent);border-radius:50%;top:18%;left:12%;pointer-events:none;animation:float 14s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,20px)}}
.card{width:100%;max-width:440px;background:var(--card);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:28px;padding:40px 34px 30px;box-shadow:0 40px 80px -20px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.04) inset;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent)}
.card::after{content:"";position:absolute;bottom:0;left:0;right:0;height:80px;background:linear-gradient(to bottom,transparent,var(--bg));pointer-events:none}
.logo-wrap{position:relative;width:70px;height:70px;margin:0 auto 16px;animation:glow 4s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 8px var(--glow))}50%{filter:drop-shadow(0 0 16px var(--glow))}}
.logo{width:70px;height:70px;border-radius:20px;display:block;margin:0 auto}
.brand-name{text-align:center;font-weight:900;font-size:1.6rem;letter-spacing:-.5px;background:linear-gradient(135deg,var(--fg) 30%,var(--accent) 80%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px}
.brand-sub{text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.92rem;color:var(--muted);margin-bottom:24px;letter-spacing:.5px}
h1{font-size:1.28rem;text-align:center;margin-bottom:6px;font-weight:800;letter-spacing:-.2px}
.sub{text-align:center;color:var(--muted);font-size:.86rem;margin-bottom:22px;line-height:1.6}
label{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:7px;letter-spacing:.3px;text-transform:uppercase}
input{width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:14px;font-size:.96rem;font-family:inherit;color:var(--fg);background:rgba(0,0,0,.25);margin-bottom:16px;transition:all .25s;outline:none;letter-spacing:.2px}
html[data-theme="light"] input{background:#fff;border-color:rgba(0,0,0,.1)}
input::placeholder{color:var(--muted);opacity:.6}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
button.primary{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--teal));color:var(--fg);border:none;border-radius:14px;font-size:1rem;font-weight:800;font-family:inherit;cursor:pointer;transition:all .25s;letter-spacing:.3px;position:relative;overflow:hidden}
button.primary::before{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);transition:left .5s}
button.primary:hover::before{left:100%}
button.primary:hover{transform:translateY(-2px);box-shadow:0 12px 30px -6px var(--glow)}
button.primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
button.primary .spinner{display:none;width:20px;height:20px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;margin:0 auto}
button.primary.loading .spinner{display:block}
button.primary.loading .btn-text{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{font-size:.83rem;text-align:center;margin-bottom:12px;min-height:20px;font-weight:600}
.msg.err{color:#e07a5f;background:rgba(224,122,95,.1);border:1px solid rgba(224,122,95,.22);border-radius:11px;padding:9px 12px}
html[data-theme="light"] .msg.err{color:#c4684a;background:rgba(196,104,74,.08)}
.switch{text-align:center;font-size:.86rem;color:var(--muted);margin-top:18px}
.switch a{color:var(--accent);font-weight:700;cursor:pointer;text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s}
.switch a:hover{border-bottom-color:var(--accent)}
.footer{text-align:center;font-size:.7rem;color:var(--muted);margin-top:20px;padding-top:14px;border-top:1px solid var(--border);opacity:.6;display:flex;align-items:center;justify-content:center;gap:5px}
.theme-fab{position:fixed;top:18px;left:18px;z-index:5;width:42px;height:42px;border-radius:13px;background:var(--card);border:1px solid var(--border);color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(10px);transition:all .2s}
.theme-fab:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.2)}
.deco{position:fixed;pointer-events:none;opacity:.05;font-size:8rem;font-family:'Cormorant Garamond',serif;color:var(--accent);z-index:0}
.deco-1{top:-20px;right:-10px;transform:rotate(-12deg)}
.deco-2{bottom:-40px;left:-15px;transform:rotate(8deg);font-size:6rem}
@media(max-width:480px){.card{padding:28px 20px 22px}h1{font-size:1.15rem}.brand-name{font-size:1.4rem}}
</style>
</head>
<body>
<div class="deco deco-1">✦</div>
<div class="deco deco-2">✦</div>
<button class="theme-fab" id="themeFab" title="تبديل المظهر" aria-label="تبديل المظهر">
  <svg id="themeFabIc" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>
<div class="card">
  <div class="logo-wrap"><img class="logo" src="/static/logo.svg" alt="الخوارزمي"></div>
  <div class="brand-name">الخوارزمي</div>
  <div class="brand-sub">من فلسطين، بالعربية، للعالم</div>
  <h1 id="title">تسجيل الدخول</h1>
  <p class="sub" id="subtitle">ادخل إلى عالم الذكاء الاصطناعي المفتوح</p>
  <div class="msg" id="msg"></div>
  <form id="form" novalidate>
    <div id="nameWrap" style="display:none">
      <label for="name">الاسم</label>
      <input id="name" type="text" placeholder="اسمك" autocomplete="name">
    </div>
    <label for="email">البريد الإلكتروني</label>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="email" dir="ltr">
    <label for="password">كلمة المرور</label>
    <input id="password" type="password" placeholder="٦ أحرف على الأقل" autocomplete="current-password" dir="ltr">
    <button class="primary" id="submitBtn" type="submit">
      <span class="btn-text">تسجيل الدخول</span>
      <span class="spinner"></span>
    </button>
  </form>
  <p class="switch" id="switch">ما عندك حساب؟ <a id="switchLink">أنشئ حساب جديد</a></p>
  <div class="footer">
    <span style="width:4px;height:4px;border-radius:50%;background:var(--accent);display:inline-block;opacity:.6"></span>
    الخوارزمي — فخامة عربية مفتوحة
  </div>
</div>
<script>
let mode = 'login';
const title = document.getElementById('title');
const subtitle = document.getElementById('subtitle');
const msg = document.getElementById('msg');
const nameWrap = document.getElementById('nameWrap');
const submitBtn = document.getElementById('submitBtn');
const form = document.getElementById('form');
const themeFab = document.getElementById('themeFab');
const themeFabIc = document.getElementById('themeFabIc');
function syncThemeFab(){try{var d=document.documentElement.getAttribute('data-theme')==='dark';themeFabIc.innerHTML=d?'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>':'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';}catch(e){}}
syncThemeFab();
if(themeFab){themeFab.onclick=()=>{var c=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';var n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('khawarizmi_theme',n);}catch(e){}syncThemeFab();};}
function render(){const l=mode==='login';title.textContent=l?'تسجيل الدخول':'إنشاء حساب جديد';subtitle.textContent=l?'ادخل إلى عالم الذكاء الاصطناعي المفتوح':'دقيقة واحدة وتدخل عالم الخوارزمي';const b=submitBtn.querySelector('.btn-text');b.textContent=l?'تسجيل الدخول':'إنشاء الحساب';nameWrap.style.display=l?'none':'block';document.getElementById('switch').innerHTML=l?'ما عندك حساب؟ <a id="switchLink">أنشئ حساب جديد</a>':'عندك حساب؟ <a id="switchLink">سجّل دخولك</a>';document.getElementById('switchLink').onclick=toggle;document.getElementById('password').autocomplete=l?'current-password':'new-password';msg.textContent='';}
function toggle(){mode=mode==='login'?'register':'login';render();}
function show(t){msg.textContent=t;msg.className='msg err';}
form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;const name=document.getElementById('name').value.trim();if(!email||!password){show('عبّي البريد الإلكتروني وكلمة المرور');return;}if(password.length<6){show('كلمة المرور لازم تكون ٦ أحرف على الأقل');return;}submitBtn.classList.add('loading');submitBtn.disabled=true;try{const res=await fetch('/api/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,password})});const data=await res.json();submitBtn.classList.remove('loading');if(res.ok&&data.ok){location.href='/';}else{show(data.error||'صار خطأ — جرّب مرة ثانية');}}catch(err){submitBtn.classList.remove('loading');show('ما قدرت أوصل للسيرفر — تأكد إنه شغّال');}submitBtn.disabled=false;});
</script>
</body>
</html>
