<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — الخوارزمي</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.getItem('khawarizmi_theme');if(t!=='dark'&&t!=='light'){t='dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans Arabic',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
:root{
  --bg:#ffffff;
  --text:#0d0d0d;
  --text-muted:#676767;
  --border:#d9d9e3;
  --border-focus:#10a37f;
  --input-bg:#ffffff;
  --btn-primary:#10a37f;
  --btn-primary-hover:#1a7f64;
  --btn-primary-text:#ffffff;
  --btn-social-hover:#f7f7f8;
  --err-bg:#fef2f2;
  --err-border:#fecaca;
  --err-text:#b91c1c;
}
html[data-theme="dark"]{
  --bg:#212121;
  --text:#ececec;
  --text-muted:#b4b4b4;
  --border:#424242;
  --border-focus:#10a37f;
  --input-bg:#2f2f2f;
  --btn-primary:#10a37f;
  --btn-primary-hover:#1a7f64;
  --btn-primary-text:#ffffff;
  --btn-social-hover:#383838;
  --err-bg:rgba(239,68,68,0.12);
  --err-border:rgba(239,68,68,0.28);
  --err-text:#fca5a5;
  color-scheme:dark;
}
body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
  position:relative;
  -webkit-font-smoothing:antialiased;
}
.theme-fab{
  position:fixed;
  top:20px;
  left:24px;
  width:38px;
  height:38px;
  border-radius:10px;
  background:transparent;
  border:1px solid var(--border);
  color:var(--text-muted);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:all .15s ease;
  z-index:10;
}
.theme-fab:hover{
  background:var(--btn-social-hover);
  color:var(--text);
}
.auth-container{
  width:100%;
  max-width:390px;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.logo-icon{
  width:52px;
  height:52px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:24px;
  overflow:hidden;
}
.logo-icon img{
  width:52px;
  height:52px;
  display:block;
}
h1{
  font-size:1.75rem;
  font-weight:700;
  text-align:center;
  margin-bottom:8px;
  color:var(--text);
  letter-spacing:-0.02em;
}
.sub{
  font-size:0.92rem;
  color:var(--text-muted);
  text-align:center;
  margin-bottom:26px;
}
form{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.field-group{
  display:flex;
  flex-direction:column;
  gap:6px;
  text-align:right;
}
label{
  font-size:0.83rem;
  font-weight:500;
  color:var(--text);
}
input{
  width:100%;
  padding:13px 14px;
  font-size:0.95rem;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--input-bg);
  color:var(--text);
  outline:none;
  transition:border-color .15s, box-shadow .15s;
}
input:focus{
  border-color:var(--border-focus);
  box-shadow:0 0 0 2px rgba(16,163,127,0.22);
}
input::placeholder{
  color:var(--text-muted);
  opacity:0.75;
}
.msg{
  font-size:0.84rem;
  text-align:center;
  min-height:0;
}
.msg.err{
  background:var(--err-bg);
  border:1px solid var(--err-border);
  color:var(--err-text);
  padding:10px 14px;
  border-radius:8px;
  margin-bottom:4px;
  line-height:1.45;
}
button.primary{
  width:100%;
  padding:13px;
  margin-top:6px;
  background:var(--btn-primary);
  color:var(--btn-primary-text);
  border:none;
  border-radius:10px;
  font-size:0.98rem;
  font-weight:600;
  cursor:pointer;
  transition:background .15s, opacity .15s;
}
button.primary:hover:not(:disabled){
  background:var(--btn-primary-hover);
}
button.primary:disabled{
  opacity:0.6;
  cursor:not-allowed;
}
.switch{
  margin-top:20px;
  text-align:center;
  font-size:0.88rem;
  color:var(--text-muted);
}
.switch a{
  color:var(--btn-primary);
  text-decoration:none;
  font-weight:600;
  cursor:pointer;
  margin-right:4px;
}
.switch a:hover{
  text-decoration:underline;
}
.footer{
  position:fixed;
  bottom:20px;
  display:flex;
  align-items:center;
  gap:16px;
  font-size:0.78rem;
  color:var(--text-muted);
}
.footer a{
  color:inherit;
  text-decoration:none;
}
.footer a:hover{
  text-decoration:underline;
}
@media(max-height:640px){
  .footer{position:static;margin-top:28px}
}
</style>
</head>
<body>

<button class="theme-fab" id="themeFab" title="تبديل المظهر" aria-label="تبديل المظهر">
  <svg id="themeFabIc" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<div class="auth-container">
  <div class="logo-icon" aria-hidden="true">
    <img src="/static/logo.svg" alt="الخوارزمي">
  </div>

  <h1 id="title">مرحباً بعودتك</h1>
  <p class="sub" id="subtitle">سجّل دخولك للمتابعة إلى الخوارزمي</p>

  <div class="msg" id="msg"></div>

  <form id="form" novalidate>
    <div class="field-group" id="nameWrap" style="display:none">
      <label for="name">الاسم الكامل</label>
      <input id="name" type="text" placeholder="اسمك الكريم" autocomplete="name">
    </div>

    <div class="field-group">
      <label for="email">عنوان البريد الإلكتروني</label>
      <input id="email" type="email" placeholder="name@example.com" autocomplete="email" dir="ltr">
    </div>

    <div class="field-group">
      <label for="password">كلمة المرور</label>
      <input id="password" type="password" placeholder="٦ أحرف على الأقل" autocomplete="current-password" dir="ltr">
    </div>

    <button class="primary" id="submitBtn" type="submit">متابعة</button>
  </form>

  <p class="switch" id="switch">ليس لديك حساب؟ <a id="switchLink">إنشاء حساب</a></p>
</div>

<div class="footer">
  <a href="javascript:void(0)">الخوارزمي AI</a>
  <span>•</span>
  <a href="javascript:void(0)">الخصوصية والأمان</a>
</div>
<script>
let mode = 'login';
const title = document.getElementById('title');
const subtitle = document.getElementById('subtitle');
const msg = document.getElementById('msg');
const nameWrap = document.getElementById('nameWrap');
const submitBtn = document.getElementById('submitBtn');
const switchText = document.getElementById('switch');
const form = document.getElementById('form');
const themeFab = document.getElementById('themeFab');
const themeFabIc = document.getElementById('themeFabIc');
function syncThemeFab(){try{var dark=document.documentElement.getAttribute('data-theme')==='dark';themeFabIc.innerHTML=dark?'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>':'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';}catch(e){}}
syncThemeFab();
if(themeFab){themeFab.onclick=()=>{var c=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';var n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('khawarizmi_theme',n);}catch(e){}syncThemeFab();};}

function render() {
  const login = mode === 'login';
  title.textContent = login ? 'مرحباً بعودتك' : 'إنشاء حساب جديد';
  subtitle.textContent = login ? 'سجّل دخولك للمتابعة إلى الخوارزمي' : 'ابدأ تجربتك مع الخوارزمي الذكي';
  submitBtn.textContent = 'متابعة';
  nameWrap.style.display = login ? 'none' : 'flex';
  switchText.innerHTML = login
    ? 'ليس لديك حساب؟ <a id="switchLink">إنشاء حساب</a>'
    : 'لديك حساب بالفعل؟ <a id="switchLink">تسجيل الدخول</a>';
  document.getElementById('switchLink').onclick = toggle;
  document.getElementById('password').autocomplete = login ? 'current-password' : 'new-password';
  msg.textContent = '';
  msg.className = 'msg';
}

function toggle() {
  mode = mode === 'login' ? 'register' : 'login';
  render();
}
document.getElementById('switchLink').onclick = toggle;

function show(t) { msg.textContent = t; msg.className = 'msg err'; }

form.addEventListener('submit', async e => {
  e.preventDefault();
  msg.textContent = '';
  msg.className = 'msg';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const name = document.getElementById('name').value.trim();

  if (!email || !password) { show('يرجى كتابة البريد الإلكتروني وكلمة المرور'); return; }
  if (password.length < 6) { show('كلمة المرور يجب ألا تقل عن ٦ أحرف'); return; }

  submitBtn.disabled = true;
  submitBtn.textContent = 'جارٍ التحقق...';
  try {
    const res = await fetch('/api/' + mode, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password }),
    });
    const data = await res.json();
    if (res.ok && data.ok) {
      location.href = '/';
    } else {
      show(data.error || 'حدث خطأ — يرجى المحاولة مرة أخرى');
      submitBtn.disabled = false;
      submitBtn.textContent = 'متابعة';
    }
  } catch (err) {
    show('تعذر الاتصال بالخادم — تأكد من تشغيله');
    submitBtn.disabled = false;
    submitBtn.textContent = 'متابعة';
  }
});
</script>
</body>
</html>
